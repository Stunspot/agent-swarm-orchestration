name: Fix Agent Swarm Pages keyboard access

on:
  push:
    branches:
      - agent/agent-swarm-docs-remediation-20260811

permissions:
  contents: write

jobs:
  fix-pages-keyboard-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agent-swarm-docs-remediation-20260811
          fetch-depth: 0
      - name: Make the scrollable install command reachable by keyboard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')
          old = '<pre><code>codex plugin marketplace add Stunspot/agent-swarm-orchestration'
          new = '<pre tabindex="0" aria-label="Codex marketplace installation commands"><code>codex plugin marketplace add Stunspot/agent-swarm-orchestration'
          if text.count(old) != 1:
              raise SystemExit(f'expected one target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/fix-agent-swarm-pages-accessibility.yml
          git config user.name "Sam \"stunspot\" Walker"
          git config user.email "130078438+Stunspot@users.noreply.github.com"
          git add docs/index.html .github/workflows/fix-agent-swarm-pages-accessibility.yml
          git commit -m "Make the Pages install command keyboard reachable"
          git push origin HEAD:agent/agent-swarm-docs-remediation-20260811
